      - name: Diagnose AWS OIDC AssumeRole
        env:
          ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          set -e

          echo "Requesting GitHub OIDC token for AWS..."

          OIDC_RESPONSE=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          OIDC_TOKEN=$(echo "$OIDC_RESPONSE" | python -c "import sys,json; print(json.load(sys.stdin)['value'])")

          export OIDC_TOKEN

          echo "Inspecting OIDC claims..."

          python - <<'PY'
          import os
          import json
          import base64

          token = os.environ["OIDC_TOKEN"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload).decode("utf-8")
          )

          print("OIDC audience:")
          print(claims.get("aud"))

          print("OIDC subject:")
          print(claims.get("sub"))

          print("OIDC repository:")
          print(claims.get("repository"))

          print("OIDC repository_id:")
          print(claims.get("repository_id"))

          print("OIDC repository_owner_id:")
          print(claims.get("repository_owner_id"))

          print("OIDC ref:")
          print(claims.get("ref"))
          PY

          echo "Testing AWS STS AssumeRoleWithWebIdentity..."

          aws sts assume-role-with-web-identity \
            --role-arn "$ROLE_ARN" \
            --role-session-name "github-oidc-diagnostic" \
            --web-identity-token "$OIDC_TOKEN" \
            --duration-seconds 900 \
            > /tmp/sts-result.json

          echo "SUCCESS: AWS STS accepted the GitHub OIDC token."

          python - <<'PY'
          import json

          with open("/tmp/sts-result.json") as f:
              data = json.load(f)

          print("AWS STS returned temporary credentials successfully.")
          print("Credentials were NOT printed.")
          print("Expiration:", data["Credentials"]["Expiration"])
          PY