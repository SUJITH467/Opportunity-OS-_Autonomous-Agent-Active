name: OpportunityOS Production Deployment

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:

  # ============================================================
  # 1. BACKEND TESTS
  # ============================================================
  validate-and-test:
    name: Backend Test Suite & Health Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          cd backend
          pip install --no-cache-dir -r requirements.txt

      - name: Run Backend Pytest Suite
        run: |
          cd backend
          python -m pytest tests/ -v

      - name: Verify Health Check Endpoint Import
        run: |
          cd backend
          python -c "from app.main import app; from fastapi.testclient import TestClient; c = TestClient(app); r = c.get('/health'); assert r.status_code == 200 and r.json()['status'] == 'healthy'; print('Health check verified successfully!')"


  # ============================================================
  # 2. BEDROCK AGENTCORE DEPLOYMENT
  # ============================================================
  deploy-bedrock-agentcore:
    name: Deploy Bedrock AgentCore Runtime
    needs: validate-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Native Bedrock AgentCore CLI & Build Tools
        run: |
          pip install uv bedrock-agentcore strands-agents
          npm install -g @aws/agentcore@0.29.0

          cd agentcore/cdk
          npm ci
          npm run build
          cd ../..

      - name: Validate Native AgentCore Configuration
        run: |
          agentcore validate

      # ------------------------------------------------------------
      # AWS OIDC LOGIN
      # ------------------------------------------------------------
      - name: Configure AWS Credentials (IAM Role via OIDC)
        if: env.AWS_DEPLOY_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}

      - name: Verify AgentCore Status
        if: env.AWS_DEPLOY_ROLE_ARN != ''
        run: |
          agentcore status
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}

      - name: Deploy Strands Agent to Bedrock AgentCore Runtime
        if: env.AWS_DEPLOY_ROLE_ARN != ''
        run: |
          agentcore deploy --yes --verbose
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}


  # ============================================================
  # 3. LIGHTSAIL DEPLOYMENT
  # ============================================================
  deploy-lightsail:
    name: Deploy to Lightsail Docker Host
    needs: deploy-bedrock-agentcore
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4


      - name: Diagnose AWS OIDC AssumeRole
        env:
          ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          set -e

          echo "Requesting GitHub OIDC token for AWS..."

          OIDC_RESPONSE=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          OIDC_TOKEN=$(echo "$OIDC_RESPONSE" | python -c "import sys,json; print(json.load(sys.stdin)['value'])")

          export OIDC_TOKEN

          echo "Inspecting OIDC claims..."

          python - <<'PY'
          import os
          import json
          import base64

          token = os.environ["OIDC_TOKEN"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload).decode("utf-8")
          )

          print("OIDC audience:")
          print(claims.get("aud"))

          print("OIDC subject:")
          print(claims.get("sub"))

          print("OIDC repository:")
          print(claims.get("repository"))

          print("OIDC repository_id:")
          print(claims.get("repository_id"))

          print("OIDC repository_owner_id:")
          print(claims.get("repository_owner_id"))

          print("OIDC ref:")
          print(claims.get("ref"))
          PY

          echo "Testing AWS STS AssumeRoleWithWebIdentity..."

          aws sts assume-role-with-web-identity \
            --role-arn "$ROLE_ARN" \
            --role-session-name "github-oidc-diagnostic" \
            --web-identity-token "$OIDC_TOKEN" \
            --duration-seconds 900 \
            > /tmp/sts-result.json

          echo "SUCCESS: AWS STS accepted the GitHub OIDC token."

          python - <<'PY'
          import json

          with open("/tmp/sts-result.json") as f:
              data = json.load(f)

          print("AWS STS returned temporary credentials successfully.")
          print("Credentials were NOT printed.")
          print("Expiration:", data["Credentials"]["Expiration"])
          PY
      # ------------------------------------------------------------
      # AWS LOGIN ONLY IF LIGHTSAIL IS CONFIGURED
      # ------------------------------------------------------------
      - name: Configure AWS Credentials (IAM Role via OIDC)
        if: env.LIGHTSAIL_HOST != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}

      # ------------------------------------------------------------
      # DEPLOY TO LIGHTSAIL
      # ------------------------------------------------------------
      - name: Deploy to AWS Lightsail Host via SSH
        if: env.LIGHTSAIL_HOST != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER || 'ubuntu' }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script_stop: true
          envs: REQUIRE_HUMAN_APPROVAL,ENVIRONMENT,AWS_REGION,NEXT_PUBLIC_API_URL
          script: |
            set -e

            APP_DIR="/opt/opportunityos"

            sudo mkdir -p "${APP_DIR}"
            sudo chown -R $USER:$USER "${APP_DIR}"

            if [ -d "${APP_DIR}/.git" ]; then
              cd "${APP_DIR}"
              git fetch --all
              git reset --hard origin/main || git reset --hard origin/master
            else
              git clone "${{ github.server_url }}/${{ github.repository }}.git" "${APP_DIR}"
              cd "${APP_DIR}"
            fi

            chmod +x ./scripts/deploy-lightsail.sh
            ./scripts/deploy-lightsail.sh

        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          REQUIRE_HUMAN_APPROVAL: "true"
          ENVIRONMENT: "production"
          AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:8000/api' }}

      # ------------------------------------------------------------
      # EXTERNAL HEALTH CHECK
      # ------------------------------------------------------------
      - name: External Health Check Verification
        if: env.LIGHTSAIL_HOST != ''
        run: |
          HOST="${{ secrets.LIGHTSAIL_HOST }}"

          echo "Verifying external health status on Lightsail host: ${HOST}..."

          for i in {1..12}; do
            BACKEND_CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://${HOST}:8000/health" || echo "000")
            FRONTEND_CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://${HOST}:3000/api/health" || echo "000")

            echo "Attempt $i: Backend HTTP $BACKEND_CODE | Frontend HTTP $FRONTEND_CODE"

            if [ "$BACKEND_CODE" = "200" ] && [ "$FRONTEND_CODE" = "200" ]; then
              echo "External health check PASSED!"
              exit 0
            fi

            sleep 5
          done

          echo "Health check failed after 60s."
          exit 1

        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}