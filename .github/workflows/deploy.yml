name: OpportunityOS Production Deployment

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:

  # ============================================================
  # 1. BACKEND TESTS
  # ============================================================
  validate-and-test:
    name: Backend Test Suite & Health Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          cd backend
          pip install --no-cache-dir -r requirements.txt

      - name: Run Backend Pytest Suite
        run: |
          cd backend
          python -m pytest tests/ -v

      - name: Verify Health Check Endpoint Import
        run: |
          cd backend
          python -c "from app.main import app; from fastapi.testclient import TestClient; c = TestClient(app); r = c.get('/health'); assert r.status_code == 200 and r.json()['status'] == 'healthy'; print('Health check verified successfully!')"


  # ============================================================
  # 2. BEDROCK AGENTCORE DEPLOYMENT
  # ============================================================
  deploy-bedrock-agentcore:
    name: Deploy Bedrock AgentCore Runtime
    needs: validate-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Native Bedrock AgentCore CLI & Build Tools
        run: |
          pip install uv bedrock-agentcore strands-agents
          npm install -g @aws/agentcore@0.29.0

          cd agentcore/cdk
          npm ci
          npm run build
          cd ../..

      - name: Validate Native AgentCore Configuration
        run: |
          agentcore validate

      # ========================================================
      # AWS OIDC AUTHENTICATION
      # ========================================================
      - name: Direct AWS OIDC Diagnostic
        env:
          ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          set -e

          echo "Requesting GitHub OIDC token for AWS STS..."

          OIDC_RESPONSE=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          OIDC_TOKEN=$(echo "$OIDC_RESPONSE" | python -c "import sys,json; print(json.load(sys.stdin)['value'])")

          export OIDC_TOKEN

          python - <<'PY'
          import os
          import json
          import base64

          token = os.environ["OIDC_TOKEN"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload).decode("utf-8")
          )

          print("================================")
          print("GitHub OIDC CLAIMS")
          print("================================")
          print("aud:", claims.get("aud"))
          print("sub:", claims.get("sub"))
          print("repository:", claims.get("repository"))
          print("repository_id:", claims.get("repository_id"))
          print("repository_owner_id:", claims.get("repository_owner_id"))
          print("ref:", claims.get("ref"))
          print("================================")
          PY

          echo "Testing AWS STS directly..."

          aws sts assume-role-with-web-identity \
            --role-arn "$ROLE_ARN" \
            --role-session-name "github-oidc-test" \
            --web-identity-token "$OIDC_TOKEN" \
            --duration-seconds 900 \
            > /tmp/sts-result.json

          echo "================================"
          echo "SUCCESS: AWS STS ACCEPTED THE OIDC TOKEN"
          echo "================================"

          python - <<'PY'
          import json

          with open("/tmp/sts-result.json") as f:
              data = json.load(f)

          print("Temporary AWS credentials were received.")
          print("Credentials are NOT being printed.")
          print("Expiration:", data["Credentials"]["Expiration"])
          PY

      - name: Configure AWS Credentials (IAM Role via OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      # ========================================================
      # VERIFY AWS LOGIN
      # ========================================================
      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity

      # ========================================================
      # VERIFY AGENTCORE
      # ========================================================
      - name: Verify AgentCore Status
        run: |
          agentcore status

      # ========================================================
      # DEPLOY AGENTCORE
      # ========================================================
      - name: Deploy Strands Agent to Bedrock AgentCore Runtime
        run: |
          agentcore deploy --yes --verbose
        env:
          AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}