[project]
name = "opportunityos"
version = "1.0.0"
description = "OpportunityOS - Autonomous AI Agent for Education, Grants & Internships"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "boto3>=1.34.0",
    "python-multipart>=0.0.9",
    "pyjwt>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "httpx>=0.26.0",
    "jinja2>=3.1.3",
    "python-dotenv>=1.0.1",
    "strands-agents>=1.42.0",
    "bedrock-agentcore>=1.23.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"